[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "shrinkers"
dynamic = ["version"]
requires-python = ">=3.9"
description = "Fast RMT (Random Matrix Theory) shrinkage kernel — Rust-accelerated RIE estimator"
authors = [{name = "alexisrosuel"}]
license = {text = "MIT"}
readme = "README.md"
dependencies = ["numpy>=1.22"]
keywords = ["random-matrix-theory", "shrinkage", "covariance", "finance", "ml"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    # One cp39-abi3 wheel covers every interpreter above the floor; these are
    # the versions the CI matrix actually builds and runs the suite on.
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/alexisrosuel/shrinkers"
Repository = "https://github.com/alexisrosuel/shrinkers"

[tool.maturin]
features = ["python"]
module-name = "shrinkers"
include = [
    {path = "shrinkers.pyi", format = "sdist"},
    {path = "shrinkers.pyi", format = "wheel"},
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint.per-file-ignores]
# Prototype / benchmark scripts are one-off measurement tools: loop variables
# in benchmark closures (B023), NaN-guard comparisons (PLR0124), broad excepts
# around plotting teardown (BLE001), and unused unpacks from result tuples
# (RUF059/F841) are intentional there. Keep strict linting for tests/.
"scripts/*" = [
    "B023",
    "BLE001",
    "EXE001",
    "FA102",
    "F841",
    "PLC0206",
    "PLR0124",
    "RUF046",
    "RUF059",
    "UP031",
]

[tool.mypy]
ignore_missing_imports = true
# No `python_version` pin: mypy no longer supports targets below 3.10, and the
# installed numpy stubs require 3.12+. The declared floor (3.9) is therefore
# only covered by the runtime CI matrix, not by mypy.
