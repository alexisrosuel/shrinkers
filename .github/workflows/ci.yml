name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (all targets, deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Docs (deny rustdoc warnings)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Tests
        run: cargo test

  lint:
    name: Python — ruff / mypy / pyo3 clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Pinned to the versions the repo was linted with: `ruff check` without
      # an explicit `select` follows the installed ruff's default rule set, so
      # a floating version makes this gate non-reproducible.
      - name: Install lint tooling
        run: pip install "ruff==0.16.1" "mypy==2.3.0" numpy

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy scripts tests

      # `src/python.rs` is behind `#[cfg(feature = "python")]`, so the rust
      # job's `cargo clippy --all-targets` never compiles it — which is how a
      # duplicated `match` arm sat there as an unreachable pattern. Python is
      # already set up here, and pyo3 only needs an interpreter (the
      # extension-module feature means nothing is linked).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy (python bindings feature)
        run: cargo clippy --all-targets --features python -- -D warnings

  python:
    name: Python ${{ matrix.python-version }} — wheel + pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the declared floor (`requires-python` in pyproject.toml,
        # `abi3-py39` in Cargo.toml) and was never actually built or tested.
        python-version: ["3.9", "3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build wheel (maturin)
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --find-interpreter
          manylinux: auto

      # Install the wheel that was just built, by explicit path. Naming the
      # distribution instead (`pip install --find-links dist shrinkers`) let
      # pip prefer the published 0.1.1 on PyPI over the equal-version local
      # wheel, so this matrix silently tested the stale release until the
      # tests finally outran the published artifact.
      - name: Install wheel + test deps
        run: |
          pip install --force-reinstall --no-deps dist/*.whl
          pip install numpy pytest

      - name: Import smoke test
        run: |
          python -c "import shrinkers; print('shrinkers', shrinkers.__version__)"
          python -c "
          import numpy as np, shrinkers
          res = shrinkers.deconvolve_spiked(np.arange(1, 11, dtype=np.float64), c=0.25)
          assert 'spikes' in res and 'bulk' in res
          print('deconvolve_spiked OK:', res['k'], 'spikes detected')
          "

      - name: Python API tests
        run: pytest tests -q
